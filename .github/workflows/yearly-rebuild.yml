# 해가 바뀌면 다시 빌드한다. 날짜가 해마다 바뀌는 기념일(어머니의 날, 설날 등)의
# 프리렌더 본문·메타 설명·OG 이미지 URL(year=)이 빌드한 해의 날짜로 박혀 있어서다.
# VERCEL_DEPLOY_HOOK_URL: Vercel → Settings → Git → Deploy Hooks 에서 main 브랜치로 만든 URL.
name: Yearly rebuild

on:
  schedule:
    - cron: '5 15 31 12 *' # 1월 1일 00:05 KST
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

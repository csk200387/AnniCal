# Secret scan(.github/workflows/security.yml) 설정. 기본 규칙은 그대로 쓰고,
# 리서치 배치 산출물의 오탐 두 가지만 허용한다. 경로와 값 모양이 둘 다 맞아야
# 넘어가므로, 같은 파일에 진짜 키가 들어가면 여전히 걸린다.
[extend]
useDefault = true

[[allowlists]]
description = "리서치 배치: candidate_key 슬러그(MM-DD-slug)와 파일 SHA-256 매니페스트"
condition = "AND"
paths = ['''^tools/research/workflow/batches/''']
regexTarget = "line"
regexes = [
  '''"candidate_key":\s*"[0-9]{2}-[0-9]{2}-[a-z0-9-]+"''',
  '''":\s*"[0-9a-f]{64}",?\s*$''',
]

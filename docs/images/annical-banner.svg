<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <title>AnniCal — 평범한 하루에, 기념할 이유 하나.</title>
  <desc>크림색 배경과 버건디 달력으로 소개하는 기념일 만물상. 오늘의 발견, 기념일 달력, 내 생일의 발견, 월별 인기 순위.</desc>
  <defs>
    <pattern id="paper" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.6" fill="#6f2222" opacity="0.07"/></pattern>
  </defs>
  <rect width="1280" height="640" rx="28" fill="#faf7f0"/>
  <rect width="1280" height="640" rx="28" fill="url(#paper)"/>
  <rect x="20" y="20" width="1240" height="600" rx="20" stroke="#e3ddd1"/>
  <g font-family="Inter, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <g transform="translate(64 52) scale(1.2)">
      <path d="M7 3h19l8 8v24a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" fill="#8b2c2c"/>
      <path d="M26 3v8h8" stroke="#e8dfca" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="m11.5 29 7-17h2.4l7 17h-5.1l-2-5.2h-6.2l-2 5.2h-1.1Zm3.8-6.8h4.9l-2.4-6.3-2.5 6.3Z" fill="#fdfcf9" fill-rule="evenodd"/>
      <path d="M9.5 29h6m5.5 0h8" stroke="#fdfcf9" stroke-width="1.3"/>
    </g>
    <text x="122" y="91" font-family="Georgia, serif" font-size="42" fill="#1f1d1a">Anni<tspan fill="#6f2222">Cal</tspan></text>
    <text x="1214" y="82" text-anchor="end" font-size="15" letter-spacing="2.5" fill="#756e62">A REASON TO CELEBRATE</text>
    <path d="M64 122h1152" stroke="#e3ddd1"/>
    <circle cx="70" cy="180" r="4" fill="#8b2c2c"/>
    <text x="85" y="186" font-size="17" font-weight="500" fill="#6f2222">하루에 하나, 새로운 발견</text>
    <g font-size="61" font-weight="700" letter-spacing="-3" fill="#1f1d1a">
      <text x="64" y="276">평범한 하루에,</text>
      <text x="64" y="359">기념할 이유 <tspan fill="#6f2222">하나.</tspan></text>
    </g>
    <path d="M338 374Q390 366 445 373M348 381Q396 375 435 380" stroke="#8b2c2c" stroke-width="3" stroke-linecap="round"/>
    <text x="66" y="425" font-size="20" fill="#4a4540">날짜에 담긴 이야기를 발견하고,</text>
    <text x="66" y="457" font-size="20" fill="#4a4540">좋아하는 날을 기억해요.</text>
    <g transform="translate(924 322)">
      <circle r="177" stroke="#8b2c2c" opacity="0.18"/>
      <circle r="215" stroke="#8b2c2c" opacity="0.1"/>
      <rect x="-132" y="-130" width="260" height="292" rx="18" fill="#e8dfca" transform="rotate(12)"/>
      <rect x="-134" y="-143" width="260" height="292" rx="18" fill="#d6cfc2" transform="rotate(-12)"/>
      <g transform="rotate(-5)">
        <rect x="-140" y="-150" width="280" height="310" rx="18" fill="#6f2222"/>
        <rect x="-85" y="-166" width="12" height="34" rx="6" fill="#1f1d1a"/>
        <rect x="73" y="-166" width="12" height="34" rx="6" fill="#1f1d1a"/>
        <text x="-114" y="-106" fill="#faf7f0" font-size="13" letter-spacing="2">EVERY DAY</text>
        <text x="114" y="-106" text-anchor="end" fill="#e8dfca" font-size="13">ANNICAL</text>
        <path d="M-114-87H114M-114 105H114" stroke="#faf7f0" opacity="0.25"/>
        <text y="47" text-anchor="middle" font-size="106" font-weight="600" letter-spacing="-6" fill="#faf7f0">365</text>
        <text y="81" text-anchor="middle" fill="#e8dfca" font-size="13" letter-spacing="3">DAYS OF DISCOVERY</text>
        <text x="-35" y="135" fill="#faf7f0" font-size="14">오늘의 발견</text>
        <circle cx="106" cy="130" r="5" fill="#e8dfca"/>
      </g>
      <g transform="translate(-245 107) rotate(-8)">
        <rect width="167" height="62" rx="12" fill="#fdfcf9" stroke="#e3ddd1"/>
        <text x="83.5" y="39" text-anchor="middle" fill="#6f2222" font-size="18" font-weight="600">내 생일은 무슨 날?</text>
      </g>
      <g transform="translate(168 -124)" stroke="#8b2c2c" stroke-width="3" stroke-linecap="round">
        <path d="M-18 0h36M0-18v36M-13-13l26 26M-13 13l26-26"/>
      </g>
    </g>
    <path d="M64 530h1152" stroke="#e3ddd1"/>
    <text x="66" y="573" fill="#4a4540" font-size="16">오늘의 발견<tspan dx="24" fill="#c9c0ad">/</tspan><tspan dx="24">기념일 달력</tspan><tspan dx="24" fill="#c9c0ad">/</tspan><tspan dx="24">내 생일의 발견</tspan><tspan dx="24" fill="#c9c0ad">/</tspan><tspan dx="24">월별 인기 순위</tspan></text>
    <text x="1214" y="573" text-anchor="end" fill="#6f2222" font-size="22" font-weight="600">annical.me ↗</text>
  </g>
</svg>
